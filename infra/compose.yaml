name: aperture-research

x-agent: &agent
  image: aperture-agent:development
  build:
    context: ..
    dockerfile: infra/agent.Dockerfile
  profiles: [application]
  env_file:
    - ${APP_ENV_FILE:-../copilotkit-app/.env}
  environment: &agent-environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aperture}
    CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aperture}
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/aperture
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    S3_ENDPOINT_URL: http://objects:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: ${S3_BUCKET:-aperture-research}
    S3_REGION: us-east-1
    APERTURE_ENV_FILE: /home/aperture/config/provider.env
    RESEARCH_SCHEDULER_ENABLED: ${RESEARCH_SCHEDULER_ENABLED:-false}
  volumes:
    - agent-home:/home/aperture
  depends_on:
    migrate: {condition: service_completed_successfully}
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    redis: {condition: service_healthy}
    neo4j: {condition: service_healthy}
    objects: {condition: service_healthy}
  restart: unless-stopped

services:
  migrate:
    <<: *agent
    command: [python, -m, src.persistence.initialize]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1

  api:
    <<: *agent
    ports: ["127.0.0.1:8123:8123"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/health',timeout=5)"]
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 10
    mem_limit: 1536m
    cpus: 2

  research-worker:
    <<: *agent
    command: [celery, -A, 'src.jobs.celery_app:app', worker, --queues=research, --concurrency=2, '--hostname=research@%h', --loglevel=WARNING]
    mem_limit: 2048m
    cpus: 2

  maintenance-worker:
    <<: *agent
    command: [celery, -A, 'src.jobs.celery_app:app', worker, --queues=maintenance, --concurrency=1, '--hostname=maintenance@%h', --loglevel=WARNING]
    mem_limit: 1024m
    cpus: 1

  documents-worker:
    <<: *agent
    # The parser does not need model vendor keys, Longbridge authorization or
    # the API/worker private-home volume. Its own execution still uses DB leases.
    env_file: []
    environment:
      <<: *agent-environment
      APERTURE_TRACING_ENABLED: "false"
      APERTURE_DOCUMENT_DNS: ${APERTURE_DOCUMENT_DNS:-system}
    volumes: []
    tmpfs: [/tmp]
    command: [celery, -A, 'src.jobs.celery_app:app', worker, --queues=documents, --concurrency=1, '--hostname=documents@%h', --loglevel=WARNING]
    mem_limit: 1536m
    cpus: 2

  knowledge-worker:
    <<: *agent
    command: [celery, -A, 'src.jobs.celery_app:app', worker, --queues=knowledge, --concurrency=1, '--hostname=knowledge@%h', --loglevel=WARNING]
    mem_limit: 1536m
    cpus: 2

  evaluation-worker:
    <<: *agent
    environment:
      <<: *agent-environment
      APERTURE_EVALUATION_API_URL: http://api:8123
    command: [celery, -A, 'src.jobs.celery_app:app', worker, --queues=evaluation, --concurrency=2, '--hostname=evaluation@%h', --loglevel=WARNING]
    mem_limit: 1536m
    cpus: 2

  beat:
    <<: *agent
    command: [celery, -A, 'src.jobs.celery_app:app', beat, --schedule=/home/aperture/celerybeat-schedule, --loglevel=WARNING]
    mem_limit: 384m
    cpus: 1

  dispatcher:
    <<: *agent
    command: [python, -m, src.jobs.dispatcher]
    mem_limit: 512m
    cpus: 1

  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_infra.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_infra.py}
      POSTGRES_DB: ${POSTGRES_DB:-aperture}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine@sha256:5cbd7145b0306399ad68422c3350b6cbd1bb95704b39f5896480e5b6d4238a04
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Run scripts/init_infra.py}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/init_infra.py}
      RABBITMQ_DEFAULT_VHOST: aperture
    ports:
      - "127.0.0.1:15673:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 15
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init_infra.py}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 192mb --maxmemory-policy allkeys-lru']
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 320m
    cpus: 1
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.12-community@sha256:9f75e8df4325a24f00fdd7a8c0bcce650a58375049b1058e496e8b43d6c36b37
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run scripts/init_infra.py}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:17687:7687"
      - "127.0.0.1:17474:7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped

  objects:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: [mini, -dir=/data, -ip=objects, -ip.bind=0.0.0.0]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run scripts/init_infra.py}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run scripts/init_infra.py}
      S3_BUCKET: ${S3_BUCKET:-aperture-research}
    ports:
      - "127.0.0.1:18333:8333"
    volumes:
      - objects-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 20
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped

volumes:
  agent-home:
  postgres-data:
  rabbitmq-data:
  neo4j-data:
  objects-data:
